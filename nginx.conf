server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve SPA: try files then fallback to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Short-circuit API requests if you want nginx to proxy; commented by default.
  # location /scheduler/ {
  #   proxy_pass http://backend:8080; # change to your backend host if needed
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  # }

  # Cache rules: index.html/manifest should not be cached; static assets long cache
  location ~* \\.(?:manifest|html)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  location ~* \\.(?:js|css|png|jpg|jpeg|gif|svg|ico|ttf|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
